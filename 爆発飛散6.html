
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星形の移動・爆発シミュレーション</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #000;
    color: #ddd;
    font-family: sans-serif;
    text-align: center;
}

h2 {
    font-size: 18px;
    font-weight: normal;
    margin: 0 0 12px;
}

canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
    background: #000;
    border: 1px solid #333;
    cursor: crosshair;
}

.controls {
    margin: 12px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 13px;
}

button {
    padding: 7px 22px;
    color: #ddd;
    background: #222;
    border: 1px solid #777;
    border-radius: 4px;
    cursor: pointer;
}

button:hover { background: #444; }

#status { color: #aaa; }
</style>
</head>

<body>

<h2>星形の移動・爆発シミュレーション</h2>

<canvas id="canvas" width="1000" height="650"></canvas>

<div class="controls">
    <button id="restart">最初から</button>
    <span id="status">移動する星形をクリックしてください</span>
</div>

<script>
"use strict";

// ==================================================
// 基本設定
// ==================================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

const W = canvas.width;
const H = canvas.height;

const BOX = {
    left: 105,
    right: 895,
    top: 55,
    bottom: 575
};

// 星形の大きさ（従来の2/3）
const STAR_OUTER_RADIUS = 77;
const STAR_INNER_RADIUS = 32;
const STAR_POINTS = 5;

// 移動速度
const STAR_SPEED = 115;       // px/秒

// 回転速度
const STAR_ROTATION_SPEED = 2.2; // rad/秒

// 物理設定
const FRAGMENT_COUNT = 120;
const GRAVITY = 300;
const WALL_BOUNCE = 0.88;
const FRAGMENT_BOUNCE = 0.76;

// 時間設定
const MAX_TIME = 25;
const SLOW_START = 20;
const FIXED_DT = 1 / 120;

// 状態
let star = {};
let fragments = [];

let exploded = false;
let stopped = false;

let elapsed = 0;
let lastTime = 0;
let accumulator = 0;


// ==================================================
// 星形の基本頂点を作成
// 中心を原点とする
// ==================================================

function createStarVertices() {
    const vertices = [];

    for (let i = 0; i < STAR_POINTS * 2; i++) {
        const angle = -Math.PI / 2 + i * Math.PI / STAR_POINTS;

        const radius =
            (i % 2 === 0)
            ? STAR_OUTER_RADIUS
            : STAR_INNER_RADIUS;

        vertices.push({
            x: Math.cos(angle) * radius,
            y: Math.sin(angle) * radius
        });
    }

    return vertices;
}

const STAR_SHAPE = createStarVertices();


// ==================================================
// 星形の現在位置・回転角度から頂点を計算
// ==================================================

function getStarPolygon() {
    const result = [];
    const cos = Math.cos(star.angle);
    const sin = Math.sin(star.angle);

    for (const p of STAR_SHAPE) {
        result.push({
            x: star.x + p.x * cos - p.y * sin,
            y: star.y + p.x * sin + p.y * cos
        });
    }

    return result;
}


// ==================================================
// 星形の出現・移動コース設定
// 左右どちらかから斜め下に移動
// ==================================================

function createMovingStar() {

    const direction = Math.random() < 0.5 ? 1 : -1;

    const startX = direction === 1
        ? BOX.left - STAR_OUTER_RADIUS - 5
        : BOX.right + STAR_OUTER_RADIUS + 5;

    const endX = direction === 1
        ? BOX.right + STAR_OUTER_RADIUS + 5
        : BOX.left - STAR_OUTER_RADIUS - 5;

    // 上部から斜め下へ進む
    const startY = BOX.top + 55 + Math.random() * 35;
    const endY = BOX.bottom - 65 - Math.random() * 35;

    const dx = endX - startX;
    const dy = endY - startY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    star = {
        x: startX,
        y: startY,
        startX: startX,
        startY: startY,
        endX: endX,
        endY: endY,
        vx: dx / distance * STAR_SPEED,
        vy: dy / distance * STAR_SPEED,
        angle: Math.random() * Math.PI * 2,
        direction: direction
    };

    exploded = false;
    stopped = false;
}


// ==================================================
// 星形の移動
// ==================================================

function updateStar(dt) {

    star.x += star.vx * dt;
    star.y += star.vy * dt;

    star.angle += STAR_ROTATION_SPEED * dt;

    // 反対側へ抜けたら、新しい星形を出現させる
    const passed =
        star.direction === 1
        ? star.x > star.endX
        : star.x < star.endX;

    if (passed) {
        createMovingStar();
    }
}


// ==================================================
// 多角形の描画
// ==================================================

function drawPolygon(vertices, fillStyle, strokeStyle) {

    if (!vertices || vertices.length < 3) return;

    ctx.beginPath();
    ctx.moveTo(vertices[0].x, vertices[0].y);

    for (let i = 1; i < vertices.length; i++) {
        ctx.lineTo(vertices[i].x, vertices[i].y);
    }

    ctx.closePath();

    ctx.fillStyle = fillStyle;
    ctx.fill();

    if (strokeStyle) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}


// ==================================================
// 点が多角形内部にあるか判定
// ==================================================

function pointInPolygon(x, y, polygon) {

    let inside = false;

    for (
        let i = 0, j = polygon.length - 1;
        i < polygon.length;
        j = i++
    ) {
        const xi = polygon[i].x;
        const yi = polygon[i].y;
        const xj = polygon[j].x;
        const yj = polygon[j].y;

        const intersect =
            ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / (yj - yi) + xi);

        if (intersect) inside = !inside;
    }

    return inside;
}


// ==================================================
// 多角形内部のランダム位置
// ==================================================

function randomPointInPolygon(polygon) {

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;

    for (const p of polygon) {
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
    }

    for (let i = 0; i < 1000; i++) {

        const x = minX + Math.random() * (maxX - minX);
        const y = minY + Math.random() * (maxY - minY);

        if (pointInPolygon(x, y, polygon)) {
            return { x, y };
        }
    }

    return {
        x: star.x,
        y: star.y
    };
}


// ==================================================
// 破片の色
// ==================================================

const COLORS = [
    "#ff9999",
    "#ffcc99",
    "#ffff99",
    "#ccff99",
    "#99ffcc",
    "#99ccff",
    "#cc99ff",
    "#ff99cc",
    "#dddddd"
];

function randomColor() {
    return COLORS[Math.floor(Math.random() * COLORS.length)];
}


// ==================================================
// 破片の生成
// ==================================================

function createFragment(polygon) {

    const p = randomPointInPolygon(polygon);

    // 小片を多く、大きな破片を少なくする
    const r = Math.random();
    let radius;

    if (r < 0.60) {
        radius = 2.5 + Math.random() * 2.5;
    } else if (r < 0.88) {
        radius = 5 + Math.random() * 4;
    } else {
        radius = 9 + Math.random() * 6;
    }

    // 4～6角形
    const sides = 4 + Math.floor(Math.random() * 3);
    const vertices = [];

    for (let i = 0; i < sides; i++) {
        const angle = Math.PI * 2 * i / sides;
        const rr = radius * (0.72 + Math.random() * 0.45);

        vertices.push({
            x: Math.cos(angle) * rr,
            y: Math.sin(angle) * rr
        });
    }

    // 爆発中心からの方向
    let dx = p.x - star.x;
    let dy = p.y - star.y;

    let length = Math.sqrt(dx * dx + dy * dy);

    let nx, ny;

    if (length < 1) {
        const a = Math.random() * Math.PI * 2;
        nx = Math.cos(a);
        ny = Math.sin(a);
    } else {
        nx = dx / length;
        ny = dy / length;
    }

    // 接線方向
    const tx = -ny;
    const ty = nx;

    // 小さい破片ほど初速を速くする
    let baseSpeed =
        250 + 1700 / Math.pow(radius, 0.85);

    baseSpeed *= 0.75 + Math.random() * 0.55;

    const type = Math.random();

    let radialSpeed;
    let tangentSpeed;

    if (type < 0.20) {
        // 高速ジェット型
        radialSpeed =
            baseSpeed * (1.25 + Math.random() * 0.40);
        tangentSpeed =
            (Math.random() - 0.5) * 360;

    } else if (type < 0.55) {
        // 旋回・散乱型
        radialSpeed =
            baseSpeed * (0.75 + Math.random() * 0.40);
        tangentSpeed =
            (Math.random() - 0.5) * 600;

    } else {
        // 通常放射型
        radialSpeed =
            baseSpeed * (0.55 + Math.random() * 0.65);
        tangentSpeed =
            (Math.random() - 0.5) * 200;
    }

    // 爆発全体の方向の偏り
    const blastX = (Math.random() - 0.5) * 200;
    const blastY = (Math.random() - 0.5) * 200;

    const vx =
        nx * radialSpeed +
        tx * tangentSpeed +
        blastX +
        (Math.random() - 0.5) * 160;

    const vy =
        ny * radialSpeed +
        ty * tangentSpeed +
        blastY +
        (Math.random() - 0.5) * 160;

    return {
        x: p.x,
        y: p.y,
        vx: vx,
        vy: vy,

        radius: radius,
        mass: radius * radius,

        angle: Math.random() * Math.PI * 2,
        angularVelocity: (Math.random() - 0.5) * 12,

        vertices: vertices,
        color: randomColor(),

        sleeping: false
    };
}


// ==================================================
// 爆発
// ==================================================

function explode() {

    if (exploded) return;

    // 回転・移動中の星形の輪郭を取得
    const polygon = getStarPolygon();

    fragments = [];

    for (let i = 0; i < FRAGMENT_COUNT; i++) {
        fragments.push(createFragment(polygon));
    }

    exploded = true;
    stopped = false;

    elapsed = 0;
    accumulator = 0;

    statusText.textContent = "爆発中...";
}


// ==================================================
// 破片同士の衝突
// 円形近似による判定
// ==================================================

function resolveFragmentCollisions() {

    for (let i = 0; i < fragments.length; i++) {

        const a = fragments[i];

        for (let j = i + 1; j < fragments.length; j++) {

            const b = fragments[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;

            const distanceSq = dx * dx + dy * dy;
            const minDistance = a.radius + b.radius;

            if (distanceSq >= minDistance * minDistance) {
                continue;
            }

            const distance = Math.sqrt(distanceSq) || 0.001;

            const nx = dx / distance;
            const ny = dy / distance;

            // 重なりを解消
            const overlap = minDistance - distance;
            const totalMass = a.mass + b.mass;

            const moveA = overlap * (b.mass / totalMass);
            const moveB = overlap * (a.mass / totalMass);

            a.x -= nx * moveA;
            a.y -= ny * moveA;

            b.x += nx * moveB;
            b.y += ny * moveB;

            const relativeVx = b.vx - a.vx;
            const relativeVy = b.vy - a.vy;

            const velocityAlongNormal =
                relativeVx * nx + relativeVy * ny;

            if (velocityAlongNormal > 0) continue;

            const impulse =
                -(1 + FRAGMENT_BOUNCE) *
                velocityAlongNormal /
                (1 / a.mass + 1 / b.mass);

            const impulseX = impulse * nx;
            const impulseY = impulse * ny;

            a.vx -= impulseX / a.mass;
            a.vy -= impulseY / a.mass;

            b.vx += impulseX / b.mass;
            b.vy += impulseY / b.mass;

            a.sleeping = false;
            b.sleeping = false;
        }
    }
}


// ==================================================
// 壁との衝突
// ==================================================

function resolveWalls(f) {

    const r = f.radius;

    if (f.x - r < BOX.left) {
        f.x = BOX.left + r;

        if (f.vx < 0) {
            f.vx = -f.vx * WALL_BOUNCE;
        }
    }

    if (f.x + r > BOX.right) {
        f.x = BOX.right - r;

        if (f.vx > 0) {
            f.vx = -f.vx * WALL_BOUNCE;
        }
    }

    if (f.y - r < BOX.top) {
        f.y = BOX.top + r;

        if (f.vy < 0) {
            f.vy = -f.vy * WALL_BOUNCE;
        }
    }

    if (f.y + r > BOX.bottom) {

        f.y = BOX.bottom - r;

        if (f.vy > 0) {
            f.vy = -f.vy * WALL_BOUNCE;
        }

        f.vx *= 0.985;

        if (Math.abs(f.vy) < 15) {
            f.vy = 0;
        }

        if (Math.abs(f.vx) < 5 && Math.abs(f.vy) < 5) {
            f.vx = 0;
            f.vy = 0;
            f.sleeping = true;
        }
    }
}


// ==================================================
// 破片の物理演算
// ==================================================

function updatePhysics(dt) {

    if (!exploded || stopped) return;

    elapsed += dt;

    // 全体の時間経過による減速
    let damping = 1;

    if (elapsed > SLOW_START) {

        const progress =
            Math.min(
                1,
                (elapsed - SLOW_START) /
                (MAX_TIME - SLOW_START)
            );

        damping = Math.pow(1 - progress, 2.5);
    }

    for (const f of fragments) {

        if (f.sleeping) continue;

        // 重力
        f.vy += GRAVITY * dt;

        // 全体減速
        f.vx *= Math.pow(damping, dt);
        f.vy *= Math.pow(damping, dt);

        // サイズ別の減速
        // 大きな破片ほど早く停止する
        const sizeDrag =
            0.08 + (f.radius / 15) * 0.85;

        const sizeDamping = Math.exp(-sizeDrag * dt);

        f.vx *= sizeDamping;
        f.vy *= sizeDamping;

        f.angularVelocity *=
            Math.exp(-sizeDrag * 1.5 * dt);

        // 位置更新
        f.x += f.vx * dt;
        f.y += f.vy * dt;

        // 回転
        f.angle += f.angularVelocity * dt;

        resolveWalls(f);
    }

    resolveFragmentCollisions();

    // 25秒で全停止
    if (elapsed >= MAX_TIME) {

        for (const f of fragments) {
            f.vx = 0;
            f.vy = 0;
            f.angularVelocity = 0;
            f.sleeping = true;

            f.x = Math.max(
                BOX.left + f.radius,
                Math.min(BOX.right - f.radius, f.x)
            );

            f.y = Math.max(
                BOX.top + f.radius,
                Math.min(BOX.bottom - f.radius, f.y)
            );
        }

        stopped = true;

        statusText.textContent =
            "停止しました。画面クリックで再スタートします";
    }
}


// ==================================================
// 破片の描画
// ==================================================

function drawFragment(f) {

    ctx.save();

    ctx.translate(f.x, f.y);
    ctx.rotate(f.angle);

    ctx.beginPath();
    ctx.moveTo(f.vertices[0].x, f.vertices[0].y);

    for (let i = 1; i < f.vertices.length; i++) {
        ctx.lineTo(f.vertices[i].x, f.vertices[i].y);
    }

    ctx.closePath();

    ctx.fillStyle = f.color;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 0.7;
    ctx.stroke();

    ctx.restore();
}


// ==================================================
// 画面描画
// ==================================================

function draw() {

    ctx.clearRect(0, 0, W, H);

    // 爆発領域の枠
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 2;

    ctx.strokeRect(
        BOX.left,
        BOX.top,
        BOX.right - BOX.left,
        BOX.bottom - BOX.top
    );

    if (!exploded) {

        // 移動中の星形
        const polygon = getStarPolygon();

        drawPolygon(
            polygon,
            "#f4c542",
            "#fff1a0"
        );

        // 中央の光沢
        ctx.beginPath();
        ctx.arc(star.x, star.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#fff4c0";
        ctx.fill();

    } else {

        // 爆発後の破片
        for (const f of fragments) {
            drawFragment(f);
        }

        ctx.fillStyle = "#aaa";
        ctx.font = "14px sans-serif";
        ctx.textAlign = "left";

        ctx.fillText(
            "TIME: " + elapsed.toFixed(1) + " s",
            BOX.left,
            35
        );
    }
}


// ==================================================
// リスタート
// ==================================================

function restart() {

    fragments = [];

    exploded = false;
    stopped = false;

    elapsed = 0;
    accumulator = 0;

    createMovingStar();

    statusText.textContent =
        "移動する星形をクリックしてください";

    draw();
}


// ==================================================
// マウス操作
// ==================================================

function getCanvasPosition(event) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: (event.clientX - rect.left) * W / rect.width,
        y: (event.clientY - rect.top) * H / rect.height
    };
}

canvas.addEventListener("click", function(event) {

    // 爆発中または停止後は、クリックで最初から
    if (exploded) {
        restart();
        return;
    }

    // 移動中の星形をクリックした場合だけ爆発
    const p = getCanvasPosition(event);
    const polygon = getStarPolygon();

    if (pointInPolygon(p.x, p.y, polygon)) {
        explode();
    }
});


// ==================================================
// リスタートボタン
// ==================================================

document.getElementById("restart").addEventListener(
    "click",
    restart
);


// ==================================================
// メインループ
// ==================================================

function animationLoop(timestamp) {

    if (!lastTime) lastTime = timestamp;

    let frameTime = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    frameTime = Math.min(frameTime, 0.05);

    if (!exploded) {

        updateStar(frameTime);

    } else if (!stopped) {

        accumulator += frameTime;

        while (accumulator >= FIXED_DT) {
            updatePhysics(FIXED_DT);
            accumulator -= FIXED_DT;
        }
    }

    draw();

    requestAnimationFrame(animationLoop);
}


// ==================================================
// 初期化
// ==================================================

createMovingStar();
requestAnimationFrame(animationLoop);

</script>
</body>
</html>
