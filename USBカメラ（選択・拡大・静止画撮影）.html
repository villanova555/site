<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>USBカメラ選択表示</title>

<style>
body {
    font-family: sans-serif;
    padding: 20px;
}

#camera {
    background: black;
    border: 1px solid #888;
    display: block;
    transition: all 0.3s ease;
}

.size-normal {
    width: 640px;
    height: 480px;
}

.size-full-browser {
    width: 100%;
    height: auto;
}

.size-fullscreen {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    background: black;
}

select {
    font-size: 16px;
    padding: 4px;
    margin-bottom: 10px;
}

.controls {
    margin-bottom: 10px;
}
</style>

</head>

<body>

<h2>USBカメラ表示 2026/8/7 Gemini版</h2>

<div class="controls">
    <select id="cameraList"></select>
    <button id="reload">更新</button>
</div>

<div class="controls">
    <button onclick="setVideoSize('normal')">通常サイズ</button>
    <button onclick="setVideoSize('full-browser')">ブラウザ幅表示</button>
    <button onclick="setVideoSize('fullscreen')">全画面表示</button>
<!-- ここに margin-left を追加して少し隙間を空ける -->
    <button id="captureBtn" style="margin-left: 15px;">静止画撮影・保存</button>
</div>

<video id="camera" class="size-normal" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const cameraList = document.getElementById("cameraList");
const captureBtn = document.getElementById("captureBtn");

let currentStream = null;

//----------------------------
// 静止画撮影・保存処理
//----------------------------
function takeSnapshot() {
    if (!currentStream) {
        alert("カメラが開始されていません");
        return;
    }

    const width = video.videoWidth || 640;
    const height = video.videoHeight || 480;

    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, width, height);

    canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        
        const now = new Date();
        const timestamp = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + "_" +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0') +
            String(now.getSeconds()).padStart(2, '0');
        
        a.download = "snapshot_" + timestamp + ".png";
        a.click();

        URL.revokeObjectURL(url);
    }, "image/png");
}

captureBtn.onclick = takeSnapshot;


//----------------------------
// サイズ切り替え処理
//----------------------------
function setVideoSize(type) {
    video.classList.remove('size-normal', 'size-full-browser', 'size-fullscreen');
    
    if (document.fullscreenElement) {
        document.exitFullscreen();
    }

    if (type === 'normal') {
        video.classList.add('size-normal');
    } else if (type === 'full-browser') {
        video.classList.add('size-full-browser');
    } else if (type === 'fullscreen') {
        video.classList.add('size-fullscreen');
        if (video.requestFullscreen) {
            video.requestFullscreen();
        }
    }
}

document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
        video.classList.remove('size-fullscreen');
        video.classList.add('size-normal');
    }
});


//----------------------------
// カメラ一覧取得
//----------------------------
async function loadCameraList(){
    cameraList.innerHTML = "";
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(device => device.kind === "videoinput");

    cameras.forEach((camera, index) => {
        const option = document.createElement("option");
        option.value = camera.deviceId;
        option.text = camera.label || "カメラ" + (index + 1);
        cameraList.appendChild(option);
    });
}


//----------------------------
// 指定カメラ表示
//----------------------------
async function openCamera(deviceId){
    if(currentStream){
        currentStream.getTracks().forEach(track => {
            track.stop();
        });
    }

    try{
        currentStream = await navigator.mediaDevices.getUserMedia({
            video: {
                deviceId: { exact: deviceId }
            },
            audio: false
        });
        video.srcObject = currentStream;
    }
    catch(e){
        alert("カメラを開けません");
        console.log(e);
    }
}


//----------------------------
// 初期化
//----------------------------
async function initialize(){
    await navigator.mediaDevices.getUserMedia({ video: true });
    await loadCameraList();
    if(cameraList.length > 0){
        openCamera(cameraList.value);
    }
}

initialize();

cameraList.addEventListener("change", () => {
    openCamera(cameraList.value);
});

document.getElementById("reload").onclick = initialize;

</script>

</body>
</html>
