<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js 小さな世界</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
    }

    #info {
        position: fixed;
        left: 15px;
        top: 15px;
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        background: rgba(0,0,0,0.45);
        padding: 10px 14px;
        border-radius: 8px;
        z-index: 10;
    }
</style>

<!-- Three.js -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="info">
    Three.js 小さな世界<br>
    マウス：視点回転　ホイール：ズーム
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";


// ==================================================
// 1. Scene
// ==================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 180);


// ==================================================
// 2. Camera
// ==================================================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

camera.position.set(25, 18, 30);


// ==================================================
// 3. Renderer
// ==================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// ==================================================
// 4. Camera controls
// ==================================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.target.set(0, 4, 0);

controls.enableDamping = true;
controls.minDistance = 8;
controls.maxDistance = 100;


// ==================================================
// 5. Lights
// ==================================================

const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0x446644,
    1.5
);

scene.add(ambientLight);


const sun = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sun.position.set(30, 40, 20);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);


// ==================================================
// 6. Ground
// ==================================================

const groundGeometry =
    new THREE.PlaneGeometry(200, 200);

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4f8a45,
        roughness: 1
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


// ==================================================
// 7. Mountains
// ==================================================

function createMountain(x, z, size) {

    const geometry =
        new THREE.ConeGeometry(
            size,
            size * 2,
            6
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x556b55,
            flatShading: true
        });

    const mountain =
        new THREE.Mesh(
            geometry,
            material
        );

    mountain.position.set(
        x,
        size,
        z
    );

    mountain.castShadow = true;
    mountain.receiveShadow = true;

    scene.add(mountain);
}


createMountain(-45, -55, 18);
createMountain(-10, -65, 25);
createMountain(30, -60, 20);
createMountain(60, -45, 15);


// ==================================================
// 8. Trees
// ==================================================

function createTree(x, z, scale = 1) {

    const tree = new THREE.Group();


    // 幹
    const trunkGeometry =
        new THREE.CylinderGeometry(
            0.6,
            0.8,
            4,
            8
        );

    const trunkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x795548
        });

    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );

    trunk.position.y = 2;

    trunk.castShadow = true;

    tree.add(trunk);


    // 葉
    const leavesGeometry =
        new THREE.ConeGeometry(
            3,
            7,
            8
        );

    const leavesMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x2e7d32
        });

    const leaves =
        new THREE.Mesh(
            leavesGeometry,
            leavesMaterial
        );

    leaves.position.y = 7;

    leaves.castShadow = true;

    tree.add(leaves);


    tree.position.set(x, 0, z);

    tree.scale.setScalar(scale);

    scene.add(tree);

    return tree;
}


// 木を配置

const trees = [];

trees.push(createTree(-12, 5, 1.2));
trees.push(createTree(12, 2, 0.9));
trees.push(createTree(-20, -15, 1.5));
trees.push(createTree(18, -20, 1.3));
trees.push(createTree(-35, -25, 1.1));
trees.push(createTree(35, -30, 1.4));


// ==================================================
// 9. 空中を浮遊する球体
// ==================================================

const balls = [];

for (let i = 0; i < 20; i++) {

    const geometry =
        new THREE.SphereGeometry(
            0.4 + Math.random() * 0.8,
            16,
            16
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color().setHSL(
                    Math.random(),
                    0.8,
                    0.6
                ),
            emissive: 0x222222
        });

    const ball =
        new THREE.Mesh(
            geometry,
            material
        );

    ball.position.set(
        (Math.random() - 0.5) * 60,
        3 + Math.random() * 15,
        (Math.random() - 0.5) * 60
    );

    ball.castShadow = true;

    scene.add(ball);

    balls.push({
        object: ball,
        speed: 0.3 + Math.random() * 0.8,
        phase: Math.random() * Math.PI * 2
    });
}


// ==================================================
// 10. 太陽
// ==================================================

const sunGeometry =
    new THREE.SphereGeometry(5, 32, 32);

const sunMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffdd66
    });

const sunMesh =
    new THREE.Mesh(
        sunGeometry,
        sunMaterial
    );

sunMesh.position.set(
    40,
    45,
    -50
);

scene.add(sunMesh);


// ==================================================
// 11. Animation
// ==================================================

const clock = new THREE.Clock();

function animate() {

    const time = clock.getElapsedTime();


    // カメラ操作
    controls.update();


    // 木を少し揺らす
    trees.forEach((tree, i) => {

        tree.rotation.z =
            Math.sin(time * 1.5 + i) * 0.02;

    });


    // 空中の球体
    balls.forEach((ball, i) => {

        ball.object.position.y +=
            Math.sin(
                time * ball.speed +
                ball.phase
            ) * 0.01;

        ball.object.rotation.x += 0.01;
        ball.object.rotation.y += 0.015;

    });


    // 太陽をゆっくり移動
    sunMesh.position.x =
        Math.cos(time * 0.05) * 50;

    sunMesh.position.z =
        Math.sin(time * 0.05) * 50;


    // 光源も太陽に追従
    sun.position.copy(
        sunMesh.position
    );


    renderer.render(
        scene,
        camera
    );

}


// ==================================================
// 12. Resize
// ==================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


renderer.setAnimationLoop(animate);

</script>

</body>
</html>
